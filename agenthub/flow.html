* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);

.glass { background: var(--glass); box-shadow: var(--glass-shadow); }
/* 버튼: 유리 — 위쪽 반사광 + 테두리 대신 빛 테(안쪽 음영) + 바닥 굴절광 + 떠 있는 그림자 */
.chip { position: relative; isolation: isolate; overflow: hidden; border: 0; color: var(--text); border-radius: 999px;
  padding: 6px 14px 6px 11px; font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;

  background:

    linear-gradient(180deg, color-mix(in srgb, var(--tint, transparent) 16%, transparent), transparent 75%),
    linear-gradient(180deg, var(--gl-top), var(--gl-bot));
  box-shadow: var(--gl-insets), var(--gl-drop);

  background: linear-gradient(140deg, var(--ag-rim) 0%, transparent 30%, transparent 70%, var(--ag-rim-2) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.chip:hover { transform: translateY(-1px); box-shadow: var(--gl-insets), var(--gl-drop-hi); }
.chip:active { transform: translateY(.5px) scale(.985); box-shadow: var(--gl-insets), var(--gl-press), 0 1px 2px rgba(0,0,0,.12); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff -25%, currentColor 55%);
  box-shadow: 0 0 8px currentColor, inset 0 -1px 1px rgba(0,0,0,.25); transition: box-shadow .2s, opacity .2s; }
.chip[aria-pressed="false"]:not(.toggle) { opacity: .5; filter: saturate(.35); }

/* 켜고 끄는 버튼: 왼쪽 작은 불빛 */
.chip.toggle::after { content: ""; order: -1; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); opacity: .6;

function pad2(v) { return String(v).padStart(2, "0"); }
function stamp(iso, short) {
  const t = new Date(iso);
  if (isNaN(t)) return String(iso || "");
  const md = `${pad2(t.getMonth() + 1)}/${pad2(t.getDate())} ${pad2(t.getHours())}:${pad2(t.getMinutes())}`;
  return short ? md : `${t.getFullYear()}-${pad2(t.getMonth() + 1)}-${pad2(t.getDate())} ${pad2(t.getHours())}:${pad2(t.getMinutes())}`;
}
function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (!(m >= 0)) return "";

  liveBtn = html("button", { type: "button", class: "chip toggle", "aria-pressed": "false", style: "--led:var(--ok)", hidden: "" }, "실시간");
  liveBtn.addEventListener("click", () => setLive(!S.live));
  const THEMES = [["", "테마: 자동"], ["light", "테마: 밝게"], ["dark", "테마: 어둡게"]];
  const cur = () => document.documentElement.dataset.theme || "";
  const th = html("button", { type: "button", class: "chip plain" }, THEMES.find(([v]) => v === cur())[1]);
  const useTheme = (v) => {
    if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme;
    th.textContent = (THEMES.find(([x]) => x === v) || THEMES[0])[1]; rain.recolor();
  };
  th.addEventListener("click", () => {
    const next = THEMES[(THEMES.findIndex(([v]) => v === cur()) + 1) % THEMES.length][0];
    // 관리 화면(theme.js)과 같은 테마를 쓴다
    try { for (const k of [THEME_KEY, "hub-theme"]) { if (next) localStorage.setItem(k, next); else localStorage.removeItem(k); } } catch (_) {}
    useTheme(next);
  });
  // 관리 화면이나 다른 탭에서 테마를 바꾸면 따라간다
  addEventListener("storage", (ev) => { if (ev.key === THEME_KEY || ev.key === "hub-theme") useTheme(ev.newValue === "light" || ev.newValue === "dark" ? ev.newValue : ""); });
  resetBtn = html("button", { type: "button", class: "chip plain" }, "배치 되돌리기");
  resetBtn.addEventListener("click", () => {
    for (const n of NODES) [n.x, n.y] = DEFAULT_POS[n.id];
    try { localStorage.removeItem(LAYOUT_KEY); } catch (_) {}
    layout(); fitView(); render();
  });
  if (!zoneById.desk) offBtn.hidden = true;
  box.append(offBtn, mo, liveBtn, th, resetBtn);
  // 반사광이 포인터를 따라 움직인다
  for (const b of box.querySelectorAll(".chip")) {
    b.addEventListener("pointermove", (ev) => { const r = b.getBoundingClientRect(); b.style.setProperty("--mx", `${ev.clientX - r.left}px`); b.style.setProperty("--my", `${ev.clientY - r.top}px`); });
    b.addEventListener("pointerleave", () => { b.style.removeProperty("--mx"); b.style.removeProperty("--my"); });
  }
}

// ---------------- 배경 매트릭스 (Agent Hub `dynamic-css-motion` 스킬 기준) ----------------
// 화면 전체를 채우지 않고 여백에 3~6줄만 낮은 대비로 흘린다. 문자는 ASCII 대문자·숫자·기호만.
// 글자는 칸에 고정되고 머리만 한 칸씩 내려간다. 지나간 칸은 제자리에서 어두워지고, 가끔 다른 글자로 바뀐다.
// 최대 24fps, 탭이 안 보이거나 '흐름 움직임'을 끄면 예약을 멈추고 마지막 장면을 그대로 둔다.
const rain = (() => {
  const cv = document.getElementById("rain"), ctx = cv.getContext("2d");
  const ALPHABET = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ<>[]{}#%+=";
  const FS = 14, COL = 18, ROW = 17, FPS = 24;
  let w = 0, h = 0, rows = 0, col = {}, streams = [], timer = 0, lastT = 0;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const hash = (a, b, c) => { let x = (a * 374761393 + b * 668265263 + c * 2147483647) | 0; x = Math.imul(x ^ (x >>> 13), 1274126177); return (x ^ (x >>> 16)) >>> 0; };
  // 칸 글자: 같은 칸은 같은 글자, 칸마다 다른 박자로 가끔 바뀐다
  const glyph = (s, row) => ALPHABET[hash(s.cx, row, s.gen + Math.floor((s.step + row * 5) / (7 + (row % 5)))) % ALPHABET.length];
  function pickX() { // 구역·패널에 덜 가리는 세로줄
    const blocks = [...document.querySelectorAll(".zone rect.zr"), document.getElementById("panel")]
      .map((e) => e.getBoundingClientRect()).filter((r) => r.width && r.bottom > 0 && r.top < h);
    const taken = streams.map((s) => s.x), cands = [];
    for (let x = COL / 2; x < w; x += COL) {
      if (taken.some((t) => Math.abs(t - x) < COL * 4)) continue;
      let cover = 0;
      for (const r of blocks) if (x > r.left && x < r.right) cover += Math.min(h, r.bottom) - Math.max(0, r.top);
      cands.push([x, cover / h]);
    }
    const open = cands.filter(([, c]) => c < 0.45), pool = open.length ? open : cands;
    return pool.length ? pool[(Math.random() * pool.length) | 0][0] : rnd(0, w);
  }
  function spawn(s, first) {
    s.x = pickX(); s.cx = Math.round(s.x / COL); s.gen = (Math.random() * 1e6) | 0; s.step = 0; s.acc = 0;
    s.len = Math.round(rnd(12, 22));          // 꼬리 길이(칸)
    s.every = rnd(38, 62);                    // 한 칸 내려가는 간격(ms) → 초당 16~26칸
    s.head = first ? Math.round(rnd(-rows * 0.2, rows)) : -Math.round(rnd(2, rows * 0.25));
    return s;
  }
  const count = () => (w < 700 ? 3 : w < 1100 ? 4 : 6);
  function recolor() {
    const cs = getComputedStyle(document.documentElement);
    col = { rain: cs.getPropertyValue("--rain").trim(), head: cs.getPropertyValue("--rain-head").trim(),
      alpha: parseFloat(cs.getPropertyValue("--rain-alpha")) || 0.4 };
    draw();
  }
  function size() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight; rows = Math.ceil(h / ROW) + 1;
    cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    streams = streams.slice(0, count());
    while (streams.length < count()) streams.push(spawn({}, true));
    draw();
  }
  function draw() {
    if (!col.head) return;
    ctx.clearRect(0, 0, w, h);
    ctx.font = `${FS}px ui-monospace, SFMono-Regular, Menlo, monospace`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const s of streams) for (let a = s.len; a >= 0; a--) {
      const row = s.head - a;
      if (row < 0 || row > rows) continue;
      const y = row * ROW + ROW / 2;
      if (a === 0) { // 머리: 밝은 글자 + 은은한 번짐
        const gl = ctx.createRadialGradient(s.x, y, 0, s.x, y, 13); gl.addColorStop(0, col.head); gl.addColorStop(1, "rgba(0,0,0,0)");
        ctx.globalAlpha = col.alpha * 0.4; ctx.fillStyle = gl; ctx.fillRect(s.x - 13, y - 13, 26, 26);
        ctx.globalAlpha = Math.min(1, col.alpha * 1.5); ctx.fillStyle = col.head; ctx.fillText(glyph(s, row), s.x, y);
      } else {
        ctx.globalAlpha = col.alpha * Math.pow(1 - a / (s.len + 1), 1.5) * (a === 1 ? 1 : 0.85);
        ctx.fillStyle = a === 1 ? col.head : col.rain; ctx.fillText(glyph(s, row), s.x, y);
      }
    }
    ctx.globalAlpha = 1;
  }
  function tick() {
    timer = 0;
    const now = performance.now(), dt = Math.min(200, now - lastT); lastT = now;
    let moved = false;
    for (const s of streams) {
      s.acc += dt;
      while (s.acc >= s.every) { s.acc -= s.every; s.head++; s.step++; moved = true; }
      if (s.head - s.len > rows) spawn(s, false);
    }
    if (moved) draw();
    schedule();
  }
  function schedule() { if (!timer && S.motion && !S.paused && !EMBED && !document.hidden) timer = setTimeout(tick, 1000 / FPS); }
  function sync() { // 움직임 켜기·끄기, 탭 보임 여부가 바뀔 때
    if (!S.motion || S.paused || EMBED || document.hidden) { clearTimeout(timer); timer = 0; return; }
    lastT = performance.now(); schedule();
  }
  addEventListener("resize", size);
  document.addEventListener("visibilitychange", sync);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => recolor());
  function start() { size(); recolor(); sync(); } // 도식을 그린 뒤 불러야 빈 여백을 고를 수 있다
  return { recolor, sync, start };
})();

// ---------------- 시작 ----------------
function start(data) {
  useData(data);
  if (TITLE) {
    document.querySelector("header h1").textContent = TITLE; document.title = TITLE;
    document.getElementById("map-title").textContent = TITLE;
  }
  document.getElementById("asof").textContent = ASOF ? `${ASOF} 기준` : "";
  loadLayout();
  build(); controls(); layout(); fitView(); render(); panel(); rain.start();
  liveProbe();
  document.addEventListener("visibilitychange", () => { if (S.live && !document.hidden) livePoll(); });
  new ResizeObserver(scaleCards).observe(svg);
  svg.addEventListener("click", (ev) => { if (ev.target === svg || ev.target.classList.contains("zr")) { S.sel = null; focus(); panel(); } });
  addEventListener("keydown", (ev) => { if (ev.key === "Escape" && S.sel) { S.sel = null; focus(); panel(); } });
  addEventListener("hashchange", () => setDeskOff(location.hash === "#off"));
}
// 파일로 열면 품고 있는 JSON만 쓴다. http로 열렸으면 Agent Hub의 /api/devices를 물어보고,
// 응답이 없거나(다른 서버, 로그인 안 됨) 형식이 다르면 품은 JSON으로 그린다.
const EMBEDDED = JSON.parse(document.getElementById("flow-data").textContent)[FLOW] || null;
// 품은 JSON은 기기 데이터 흐름뿐이다. 다른 도식은 Agent Hub에서만 열린다.
function noData() {
  document.getElementById("panel").textContent = "도식 데이터가 없습니다.";
}
if (EMBEDDED) start(EMBEDDED); else noData();
// The embedding page says when this frame is off screen: stop the dots and the rain until it comes back.
addEventListener("message", (ev) => {
  if (ev.origin !== location.origin || !ev.data || ev.data.flow == null) return;
  S.paused = ev.data.flow === "pause";
  if (S.paused) fx.pauseAnimations(); else fx.unpauseAnimations();
  rain.sync();
});
</script>
